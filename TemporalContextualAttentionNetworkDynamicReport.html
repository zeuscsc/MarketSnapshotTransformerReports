<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporal Contextual Attention Network Predictions Preview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a202c;
        }
        input[type="date"]::-webkit-calendar-picker-indicator {
            cursor: pointer;
            filter: invert(0.8) brightness(100%) sepia(0%) saturate(10000%) hue-rotate(0deg);
        }

            background: #2d3748 !important;
            color: #e2e8f0;
            border: 1px solid #4a5568 !important;

        .apexcharts-tooltip div {
            padding: 2px 6px;

            background-color: #2d3748;

            border-radius: 0.5rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .info-card:hover {
            transform: translateY(-5px);
        }
        /* --- Loader Styles --- */
        #loader-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(26, 32, 44, 0.9); /* bg-gray-900 with more opacity */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            flex-direction: column;
            gap: 1rem;
        }
        .spinner {
            border: 8px solid #4a5568; /* border-gray-700 */
            border-top: 8px solid #4299e1; /* border-blue-400 */
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white">
    <div id="loader-overlay">
        <div class="spinner"></div>
        <p class="text-lg text-gray-300 mt-4">Loading prediction data...</p>
    </div>
    <div class="w-full max-w-7xl mx-auto flex flex-col space-y-6 p-4">
        
        <header class="text-center">
            <h1 class="text-4xl font-bold text-gray-100">Temporal Contextual Attention Network Predictions Preview</h1>

            <p id="batch-type" class="text-lg text-gray-400 mt-2"></p>

        <div class="flex flex-wrap justify-center items-center gap-4">
            <div class="flex items-center space-x-2 bg-gray-800 p-2 rounded-lg">

            <div class="flex items-center space-x-2 bg-gray-800 p-2 rounded-lg">
                <label for="start-date-picker" class="font-semibold text-gray-300 text-sm">Start Date:</label>
                <input type="date" id="start-date-picker" class="bg-gray-700 text-white rounded-md p-1.5 text-sm border-gray-600 focus:ring-blue-500 focus:border-blue-500">
            </div>

            <div class="flex items-center space-x-2 bg-gray-800 p-2 rounded-lg">
                <label for="end-date-picker" class="font-semibold text-gray-300 text-sm">End Date:</label>
                <input type="date" id="end-date-picker" class="bg-gray-700 text-white rounded-md p-1.5 text-sm border-gray-600 focus:ring-blue-500 focus:border-blue-500">
            </div>

            <div class="flex items-center space-x-2 bg-gray-800 p-2 rounded-lg">
                <span class="font-semibold text-gray-300 mr-2 text-sm">Assets:</span>
                <div id="ticker-buttons" class="flex space-x-2"></div>
            </div>

            <!-- <div class="flex items-center space-x-2 bg-gray-800 p-2 rounded-lg">
                <span class="font-semibold text-gray-300 mr-2 text-sm">Assets:</span>
                <button data-ticker="INDEXCBOE-VIX" class="control-button ticker-btn px-4 py-2 text-sm font-medium rounded-md transition-colors duration-200">CBOE-VIX</button>
                <button data-ticker="INDEXHANGSENG-HSI" class="control-button ticker-btn px-4 py-2 text-sm font-medium rounded-md transition-colors duration-200">HSI</button>
                <button data-ticker="INDEXNASDAQ-_IXIC" class="control-button ticker-btn px-4 py-2 text-sm font-medium rounded-md transition-colors duration-200">NASDAQ</button>
            </div> -->
        </div>

        <div id="info-cards" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>

        <div class="bg-gray-800 p-6 rounded-xl shadow-2xl w-full h-[60vh]">
            <div id="mergedChart" class="h-full"></div>
        </div>

    </div>
    
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.0"></script>
<script>
    let uniqueTickers = new Set();

    const loaderOverlay = document.getElementById('loader-overlay');
    // --- Global State ---
    let forecastData = {}; // This will be populated from the CSV
    let statsData = {}; // This will hold dynamically computed stats per ticker
    let activeForecastDate;
    let activeStartDate;
    let activeEndDate;
    let activeTicker = 'INDEXNASDAQ-_IXIC';
    let mergedChart = null;

    // --- DOM Elements ---
    const mergedContainer = document.querySelector("#mergedChart");
    const subtitle = document.getElementById('subtitle');
    const batchTypeElement = document.getElementById('batch-type');
    let tickerButtons = document.querySelectorAll('.ticker-btn');
    const forecastDatePicker = document.getElementById('forecast-date-picker');
    const startDatePicker = document.getElementById('start-date-picker');
    const endDatePicker = document.getElementById('end-date-picker');
    const infoCardsContainer = document.getElementById('info-cards');
    
    // --- Data Loading and Processing ---
    function loadAndProcessData() {
        const originalUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQNyFHcXEzmZ3lp6ciRqJYHBOOwieiAgUP_TOgxuQN22tA9XVCmYjsMxmnF6cBnxP2kCSCGnwQ1Q9L8/pub?gid=0&single=true&output=csv";
        
        // const proxyUrl = "https://corsproxy.io/?" + encodeURIComponent(originalUrl);
        const proxyUrl = "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(originalUrl);
        const csvUrl = proxyUrl;

        Papa.parse(csvUrl, {
            download: true,
            header: true,
            dynamicTyping: true, // Automatically converts numbers
            complete: function(results) {
                const processedData = {};
                results.data.forEach(row => {
                    if (!row.Model_Date || !row.Ticker) {
                        return;
                    }

                    const modelDate = row.Model_Date;
                    const ticker = row.Ticker;

                    uniqueTickers.add(ticker);

                    if (!processedData[modelDate]) {
                        processedData[modelDate] = {};
                    }
                    if (!processedData[modelDate][ticker]) {
                        processedData[modelDate][ticker] = [];
                    }
                    
                    const record = {
                        Date: row.Date,
                        Ticker: row.Ticker,
                        Pred_Open: row.Pred_Open,
                        Pred_High: row.Pred_High,
                        Pred_Low: row.Pred_Low,
                        Pred_Close: row.Pred_Close,
                        Actual_Open: row.Actual_Open,
                        Actual_High: row.Actual_High,
                        Actual_Low: row.Actual_Low,
                        Actual_Close: row.Actual_Close
                    };

                    processedData[modelDate][ticker].push(record);
                });
                
                forecastData = processedData;
                console.log("✅ Data successfully loaded and processed:", forecastData);
                initialize();
                loaderOverlay.style.display = 'none'; // Hide loader
            },
            error: function(error) {
                console.error("Error loading or parsing CSV data:", error);
                mergedContainer.innerHTML = `<div class="flex items-center justify-center h-full"><p class="text-red-400">Failed to load data. The CORS proxy may be down.</p></div>`;
                loaderOverlay.style.display = 'none'; // Hide loader
            }
        });
    }

    function getTickerLabel(ticker) {
        const labels = {
            'INDEXHANGSENG-HSI': 'HSI',
            'INDEXNASDAQ-_IXIC': 'NASDAQ'
            // Add more mappings if known
        };
        return labels[ticker] || ticker.split(/[-_]/).pop().toUpperCase(); // Fallback to last part
    }

    // --- Trade Simulation and Analysis ---
    function simulateAndAnalyzeTrades(data, startDate, endDate) {
        let statsByTicker = {};
        let totalBatchesByTicker = {};
        let tradesByTicker = {};

        for (let creationDate in data) {
            if (new Date(creationDate) < new Date(startDate) || new Date(creationDate) > new Date(endDate)) continue;
            for (let asset in data[creationDate]) {
                if (!statsByTicker[asset]) {
                    statsByTicker[asset] = {};
                    totalBatchesByTicker[asset] = 0;
                    tradesByTicker[asset] = [];
                }

                let predictions = data[creationDate][asset];
                if (predictions.length !== 5) continue;
                totalBatchesByTicker[asset] += 1;

                // Compute predicted mids and check trend
                let mids = predictions.map(p => (p.Pred_Low + p.Pred_High) / 2);
                let sumY = mids.reduce((a, b) => a + b, 0);
                let sumXY = 0 * mids[0] + 1 * mids[1] + 2 * mids[2] + 3 * mids[3] + 4 * mids[4];
                let slope = (sumXY - 2 * sumY) / 10;
                if (slope < 0) continue; // No action if trend is downward

                let batchMinLow = Math.min(...predictions.map(p => p.Pred_Low));
                let batchMaxHigh = Math.max(...predictions.map(p => p.Pred_High));

                let dates = predictions.map(p => p.Date);
                let actualLows = predictions.map(p => p.Actual_Low);
                let actualHighs = predictions.map(p => p.Actual_High);
                let actualCloses = predictions.map(p => p.Actual_Close);

                let buyIndex = null;
                for (let i = 0; i < 5; i++) {
                    if (actualLows[i] <= batchMinLow) {
                        buyIndex = i;
                        break;
                    }
                }

                if (buyIndex === null) continue;

                let buyDate = dates[buyIndex];
                let buyPrice = batchMinLow;

                let sellIndex = null;
                for (let i = buyIndex + 1; i < 5; i++) {
                    if (actualHighs[i] >= batchMaxHigh) {
                        sellIndex = i;
                        break;
                    }
                }

                let forced = false;
                let sellDate, sellPrice;
                if (sellIndex === null) {
                    forced = true;
                    sellIndex = 4;
                    sellDate = dates[4];
                    sellPrice = actualCloses[4];
                } else {
                    sellDate = dates[sellIndex];
                    sellPrice = batchMaxHigh;
                }

                let profit = sellPrice - buyPrice;
                let cutGain = forced && profit > 0;
                let cutLoss = forced && profit < 0;

                tradesByTicker[asset].push({
                    creation_date: creationDate,
                    asset: asset,
                    buy_date: buyDate,
                    buy_price: buyPrice,
                    sell_date: sellDate,
                    sell_price: sellPrice,
                    profit: profit,
                    forced: forced,
                    cut_gain: cutGain,
                    cut_loss: cutLoss
                });
            }
        }

        for (let asset in statsByTicker) {
            let trades = tradesByTicker[asset];
            let totalBatches = totalBatchesByTicker[asset];
            let numTrades = trades.length;

            let numGains = trades.filter(t => t.profit > 0).length;
            let numLosses = trades.filter(t => t.profit < 0).length;
            let pctGains = numTrades > 0 ? (numGains / numTrades * 100) : 0;
            let pctLosses = numTrades > 0 ? (numLosses / numTrades * 100) : 0;

            let forcedTrades = trades.filter(t => t.forced);
            let numForced = forcedTrades.length;
            let numCutGain = forcedTrades.filter(t => t.cut_gain).length;
            let numCutLoss = forcedTrades.filter(t => t.cut_loss).length;
            let pctCutGain = numForced > 0 ? (numCutGain / numForced * 100) : 0;
            let pctCutLoss = numForced > 0 ? (numCutLoss / numForced * 100) : 0;

            let numSuccessful = numTrades - numForced;
            let pctSuccessful = numTrades > 0 ? (numSuccessful / numTrades * 100) : 0;

            let numSuccessBatches = numSuccessful;
            let numFailedBatches = numForced;
            let numNoActionBatches = totalBatches - numTrades;
            let pctSuccessBatches = totalBatches > 0 ? (numSuccessBatches / totalBatches * 100) : 0;
            let pctFailedBatches = totalBatches > 0 ? (numFailedBatches / totalBatches * 100) : 0;
            let pctNoActionBatches = totalBatches > 0 ? (numNoActionBatches / totalBatches * 100) : 0;

            statsByTicker[asset] = {
                total_batches: totalBatches,
                num_trades: numTrades,
                num_gains: numGains,
                num_losses: numLosses,
                pct_gains: pctGains,
                pct_losses: pctLosses,
                num_forced: numForced,
                num_cut_gain: numCutGain,
                num_cut_loss: numCutLoss,
                pct_cut_gain: pctCutGain,
                pct_cut_loss: pctCutLoss,
                num_successful: numSuccessful,
                pct_successful: pctSuccessful,
                num_success_batches: numSuccessBatches,
                num_failed_batches: numFailedBatches,
                num_no_action_batches: numNoActionBatches,
                pct_success_batches: pctSuccessBatches,
                pct_failed_batches: pctFailedBatches,
                pct_no_action_batches: pctNoActionBatches
            };
        }

        return statsByTicker;
    }
    
    // --- Batch Type Determination ---
    function getBatchType(forecastDate, ticker) {
        const predictions = forecastData[forecastDate]?.[ticker];
        if (!predictions || predictions.length !== 5) return 'Invalid Batch';

        // Compute predicted mids and check trend
        let mids = predictions.map(p => (p.Pred_Low + p.Pred_High) / 2);
        let sumY = mids.reduce((a, b) => a + b, 0);
        let sumXY = 0 * mids[0] + 1 * mids[1] + 2 * mids[2] + 3 * mids[3] + 4 * mids[4];
        let slope = (sumXY - 2 * sumY) / 10;
        if (slope < 0) return 'No Action Batch (Predicted Downward Trend)';

        let batchMinLow = Math.min(...predictions.map(p => p.Pred_Low));
        let batchMaxHigh = Math.max(...predictions.map(p => p.Pred_High));

        let actualLows = predictions.map(p => p.Actual_Low);
        let actualHighs = predictions.map(p => p.Actual_High);

        let buyIndex = null;
        for (let i = 0; i < 5; i++) {
            if (actualLows[i] <= batchMinLow) {
                buyIndex = i;
                break;
            }
        }

        if (buyIndex === null) return 'No Action Batch (Buy Not Triggered)';

        let sellIndex = null;
        for (let i = buyIndex + 1; i < 5; i++) {
            if (actualHighs[i] >= batchMaxHigh) {
                sellIndex = i;
                break;
            }
        }

        if (sellIndex !== null) return 'Successful Batch';
        return 'Failed Batch';
    }
    
    // --- Infographics Rendering Function ---
    function updateInfoCards(ticker) {
        const tickerData = statsData[ticker];
        if (!tickerData) return;

        let cardsHtml = `
            <div class="info-card">
                <h3 class="text-lg font-semibold text-gray-300">Trades</h3>
                <p class="text-2xl font-bold text-white">${tickerData.num_trades}</p>
            </div>
            <div class="info-card">
                <h3 class="text-lg font-semibold text-gray-300">Win Rate</h3>
                <p class="text-2xl font-bold text-green-400">${tickerData.pct_gains.toFixed(2)}%</p>
            </div>
            <div class="info-card">
                <h3 class="text-lg font-semibold text-gray-300">Loss Rate</h3>
                <p class="text-2xl font-bold text-red-400">${tickerData.pct_losses.toFixed(2)}%</p>
            </div>
            <div class="info-card">
                <h3 class="text-lg font-semibold text-gray-300">Successful Batches</h3>
                <p class="text-2xl font-bold text-white">${tickerData.pct_success_batches.toFixed(2)}%</p>
            </div>
            <div class="info-card">
                <h3 class="text-lg font-semibold text-gray-300">Failed Batches</h3>
                <p class="text-2xl font-bold text-white">${tickerData.pct_failed_batches.toFixed(2)}%</p>
            </div>
            <div class="info-card">
                <h3 class="text-lg font-semibold text-gray-300">No Action Batches</h3>
                <p class="text-2xl font-bold text-white">${tickerData.pct_no_action_batches.toFixed(2)}%</p>
            </div>
        `;

        infoCardsContainer.innerHTML = cardsHtml;
    }

    // --- Chart Rendering Function ---
    function renderCharts() {
        const dataForForecastDate = forecastData[activeForecastDate] || {};
        const chartData = dataForForecastDate[activeTicker] || [];

        if (mergedChart) mergedChart.destroy();
        
        if (chartData.length === 0) {
            mergedContainer.innerHTML = `<div class="flex items-center justify-center h-full"><p class="text-gray-400">No data available for ${activeTicker} on ${activeForecastDate}.</p></div>`;
            batchTypeElement.textContent = '';
            return;
        } else {
            mergedContainer.innerHTML = '';
        }

        const batchType = getBatchType(activeForecastDate, activeTicker);
        batchTypeElement.textContent = `Batch Type: ${batchType}`;

        subtitle.textContent = `Analysis for ${activeTicker} (Last observation: ${activeForecastDate}, Predictions for subsequent days)`;

        const actualCandleSeries = chartData.map(d => ({ x: new Date(d.Date), y: [d.Actual_Open, d.Actual_High, d.Actual_Low, d.Actual_Close] }));
        const predictedCandleSeries = chartData.map(d => ({ x: new Date(d.Date), y: [d.Pred_Open, d.Pred_High, d.Pred_Low, d.Pred_Close] }));
        const actualVolatilityBand = chartData.map(d => ({ x: new Date(d.Date), y: [d.Actual_Low, d.Actual_High] }));
        const predictedVolatilityBand = chartData.map(d => ({ x: new Date(d.Date), y: [d.Pred_Low, d.Pred_High] }));

        const allPrices = chartData.flatMap(d => [d.Actual_High, d.Actual_Low, d.Pred_High, d.Pred_Low].filter(p => p != null));
        const minPrice = Math.min(...allPrices);
        const maxPrice = Math.max(...allPrices);
        const padding = (maxPrice - minPrice) * 0.0;

        const mergedOptions = {
            chart: {
                height: '100%',
                type: 'candlestick',
                animations: { enabled: true },
            },
            series: [
                { name: 'Actual Price', type: 'candlestick', data: actualCandleSeries },
                { name: 'Predicted Price', type: 'candlestick', data: predictedCandleSeries },
                { name: 'Predicted Range', type: 'rangeArea', data: predictedVolatilityBand }, 
                { name: 'Actual Range', type: 'rangeArea', data: actualVolatilityBand }
            ],
            colors: ['#AAA', '#AAA', '#FFC107', '#007BFF'],
            plotOptions: {
                candlestick: {
                    colors: {
                        upward: '#00B746',
                        downward: '#EF403C'
                    }
                }
            },
            fill: { opacity: [1, 0.75] },
            stroke: { curve: 'straight', width: [2, 2] },
            dataLabels: { enabled: false },
            title: { text: `Actual Prices up to ${activeForecastDate} with Predicted Prices and Volatility Overlay: ${activeTicker}`, align: 'left' },
            annotations: {
                xaxis: [{
                    x: new Date(activeForecastDate).getTime(),
                    strokeDashArray: 0,
                    borderColor: '#775DD0',
                    label: {
                        borderColor: '#775DD0',
                        style: {
                            color: '#fff',
                            background: '#775DD0',
                        },
                        text: 'Last Observation Day',
                    }
                }]
            },
            xaxis: { 
                type: 'datetime',
                crosshairs: {
                    show: true,
                    stroke: {
                        color: '#90A4AE',
                        width: 1,
                        dashArray: 4,
                    }
                },
                tooltip: {
                    enabled: true,
                }
            },
            yaxis: {
                labels: { formatter: (value) => value !== undefined && value !== null ? '$' + value.toFixed(2) : '' },
                min: minPrice - padding,
                max: maxPrice + padding,
                tooltip: { enabled: true }
            },
            tooltip: {
                shared: true,
                intersect: false,
                custom: function({ series, seriesIndex, dataPointIndex, w }) {
                    if (dataPointIndex === undefined || dataPointIndex < 0) return '';

                    const date = new Date(w.globals.seriesX[0][dataPointIndex]).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
                    const candle = w.globals.initialSeries[0].data[dataPointIndex].y;
                    const pred = w.globals.initialSeries[1].data[dataPointIndex].y;

                    const o = candle[0] !== undefined ? candle[0].toFixed(2) : 'N/A';
                    const h = candle[1] !== undefined ? candle[1].toFixed(2) : 'N/A';
                    const l = candle[2] !== undefined ? candle[2].toFixed(2) : 'N/A';
                    const c = candle[3] !== undefined ? candle[3].toFixed(2) : 'N/A';

                    const pred_o = pred[0] !== undefined ? pred[0].toFixed(2) : 'N/A';
                    const pred_h = pred[1] !== undefined ? pred[1].toFixed(2) : 'N/A';
                    const pred_l = pred[2] !== undefined ? pred[2].toFixed(2) : 'N/A';
                    const pred_c = pred[3] !== undefined ? pred[3].toFixed(2) : 'N/A';

                    return `
                        <div class="apexcharts-tooltip-title" style="font-weight: bold; padding: 4px 8px; background: #1a202c; color: #fff;">${date}</div>
                        <div style="padding: 4px 8px;">
                            <strong>Actual:</strong><br>
                            Open: $${o}<br>
                            High: $${h}<br>
                            Low: $${l}<br>
                            Close: $${c}
                        </div>
                        <div style="padding: 4px 8px;">
                            <strong>Predicted:</strong><br>
                            Open: $${pred_o}<br>
                            High: $${pred_h}<br>
                            Low: $${pred_l}<br>
                            Close: $${pred_c}
                        </div>
                    `;
                }
            },
            legend: { horizontalAlign: 'center', position: 'top' },
            theme: { mode: 'dark' }
        };
        mergedChart = new ApexCharts(mergedContainer, mergedOptions);
        mergedChart.render();
    }

    // --- Button Styling Function ---
    function updateButtonStyles() {
        tickerButtons.forEach(button => {
            const isActive = button.dataset.ticker === activeTicker;
            button.classList.toggle('bg-blue-600', isActive);
            button.classList.toggle('text-white', isActive);
            button.classList.toggle('bg-gray-700', !isActive);
            button.classList.toggle('text-gray-300', !isActive);
            button.classList.toggle('hover:bg-blue-500', !isActive);
        });
    }

    function updateStats() {
        statsData = simulateAndAnalyzeTrades(forecastData, activeStartDate, activeEndDate);
        console.log("✅ Stats dynamically computed for range:", statsData);
        updateInfoCards(activeTicker);
    }

    // --- Main Initialization Function (called AFTER data is loaded) ---
    function initialize() {
        const availableDates = Object.keys(forecastData).sort((a, b) => new Date(b) - new Date(a));
        if (availableDates.length > 0) {
            const minDate = availableDates[availableDates.length - 1];
            const maxDate = availableDates[0];
            forecastDatePicker.min = minDate;
            forecastDatePicker.max = maxDate;
            startDatePicker.min = minDate;
            startDatePicker.max = maxDate;
            endDatePicker.min = minDate;
            endDatePicker.max = maxDate;
            activeForecastDate = minDate;
            activeStartDate = minDate;
            activeEndDate = maxDate;
            forecastDatePicker.value = activeForecastDate;
            startDatePicker.value = activeStartDate;
            endDatePicker.value = activeEndDate;
        }
        
        forecastDatePicker.addEventListener('change', () => {
            activeForecastDate = forecastDatePicker.value;
            renderCharts();
        });

        startDatePicker.addEventListener('change', () => {
            activeStartDate = startDatePicker.value;
            updateStats();
        });

        endDatePicker.addEventListener('change', () => {
            activeEndDate = endDatePicker.value;
            updateStats();
        });

        const tickerButtonsContainer = document.getElementById('ticker-buttons');
        ['INDEXHANGSENG-HSI', 'INDEXNASDAQ-_IXIC'].forEach(fixedTicker => {
            if (uniqueTickers.has(fixedTicker)) {
                const button = document.createElement('button');
                button.dataset.ticker = fixedTicker;
                button.textContent = getTickerLabel(fixedTicker);
                button.classList.add('control-button', 'ticker-btn', 'px-4', 'py-2', 'text-sm', 'font-medium', 'rounded-md', 'transition-colors', 'duration-200');
                tickerButtonsContainer.appendChild(button);
            }
        });

        updateStats();
        let maxWinRate = -1;
        let bestTicker = null;
        for (let t in statsData) {
            if (statsData[t].pct_gains > maxWinRate) {
                maxWinRate = statsData[t].pct_gains;
                bestTicker = t;
            }
        }
        if (bestTicker && !Array.from(tickerButtonsContainer.children).some(b => b.dataset.ticker === bestTicker)) {
            const button = document.createElement('button');
            button.dataset.ticker = bestTicker;
            button.textContent = `Best: ${getTickerLabel(bestTicker)}`;
            button.classList.add('control-button', 'ticker-btn', 'px-4', 'py-2', 'text-sm', 'font-medium', 'rounded-md', 'transition-colors', 'duration-200');
            tickerButtonsContainer.appendChild(button);
        }

        // Re-query after all buttons are added
        tickerButtons = document.querySelectorAll('.ticker-btn');

        // Attach event listeners after re-query
        tickerButtons.forEach(button => {
            button.addEventListener('click', () => {
                activeTicker = button.dataset.ticker;
                updateButtonStyles();
                updateInfoCards(activeTicker);
                renderCharts();
            });
        });
        
        // Optional: Ensure activeTicker is valid (set to best or first if not)
        if (!Array.from(tickerButtons).some(b => b.dataset.ticker === activeTicker)) {
            activeTicker = bestTicker || tickerButtons[0]?.dataset.ticker;
        }

        updateButtonStyles();
        renderCharts();
    }
    
    // --- Start the process on page load ---
    window.onload = loadAndProcessData;
</script>

</body>
</html>
