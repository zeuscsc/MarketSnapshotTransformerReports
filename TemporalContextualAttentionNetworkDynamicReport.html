    let edgeRiskMultiplier = 0.0;
    let edgeMinAbs = 0.0001;
    let edgeVolFactor = 0.00009;
    let scaleParts = 1;
    let scaleEntryStyle = 'even';
    let scaleExitStyle = 'high_bias';
    let mergedChart = null;

    // --- DOM Elements ---
    const mergedContainer = document.querySelector("#mergedChart");
    const subtitle = document.getElementById('subtitle');
    const batchTypeElement = document.getElementById('batch-type');
    const suggestedPricesElement = document.getElementById('suggested-prices');
    let assetButtons = document.querySelectorAll('.asset-btn');
    const forecastDatePicker = document.getElementById('forecast-date-picker');
    const startDatePicker = document.getElementById('start-date-picker');
    const endDatePicker = document.getElementById('end-date-picker');
    const cutLossInput = document.getElementById('cutloss-pct');
    const initialCapitalInput = document.getElementById('initial-capital');
    const feePctInput = document.getElementById('fee-pct');
    const fixedFeeInput = document.getElementById('fixed-fee');
    const minGainInput = document.getElementById('min-gain-pct');
    const edgeRiskMultiplierInput = document.getElementById('edge-risk-multiplier');
    const edgeMinAbsInput = document.getElementById('edge-min-abs');
    const edgeVolFactorInput = document.getElementById('edge-vol-factor');
    const scalePartsInput = document.getElementById('scale-parts');
    const scaleEntryStyleInput = document.getElementById('scale-entry-style');
    const scaleExitStyleInput = document.getElementById('scale-exit-style');
    const infoCardsContainer = document.getElementById('info-cards');
    const shareButton = document.getElementById('share-button');
    const jumpToLatestButton = document.getElementById('jump-to-latest');
    
    // --- Helper Functions ---
    function linspace(start, end, num) {
        if (num === 1) return [start];
        const step = (end - start) / (num - 1);
        const arr = [];
        for (let i = 0; i < num; i++) {
            arr.push(start + (step * i));
        }
        return arr;
    }

    // --- Data Loading and Processing ---
    function loadAndProcessData() {
        const originalUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSNOp63XU57KV_QxP2zb3BrhgUWTxBU8njIDBqqlXGLsMGzqXFoyC5nObNieMChnkh_KWYUjqpzgVHg/pub?gid=0&single=true&output=csv";
        
        // const proxyUrl = "https://corsproxy.io/?" + encodeURIComponent(originalUrl);
        const proxyUrl = "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(originalUrl);
        const csvUrl = proxyUrl;

        Papa.parse(csvUrl, {
            download: true,
            header: true,
            dynamicTyping: true, // Automatically converts numbers
            complete: function(results) {
                const processedData = {};
                results.data.forEach(row => {
                    if (!row.date || !row.asset) {
                        return;
                    }

                    const modelDate = row.date;
                    const asset = row.asset;

                    uniqueAssets.add(asset);

                    if (!processedData[modelDate]) {
                        processedData[modelDate] = {};
                    }
                    if (!processedData[modelDate][asset]) {
                        processedData[modelDate][asset] = [];
                    }
                    
                    const record = {
                        prediction_date: row.prediction_date,
                        asset: row.asset,
                        predicted_open: row.predicted_open,
                        predicted_high: row.predicted_high,
                        predicted_low: row.predicted_low,
                        predicted_close: row.predicted_close,
                        actual_open: row.actual_open,
                        actual_high: row.actual_high,
                        actual_low: row.actual_low,
                        actual_close: row.actual_close
                    };

                    processedData[modelDate][asset].push(record);
                });
                
                forecastData = processedData;
                console.log("✅ Data successfully loaded and processed:", forecastData);
                initialize();
                loaderOverlay.style.display = 'none'; // Hide loader
            },
            error: function(error) {
                console.error("Error loading or parsing CSV data:", error);
                mergedContainer.innerHTML = `<div class="flex items-center justify-center h-full"><p class="text-red-400">Failed to load data. The CORS proxy may be down.</p></div>`;
                loaderOverlay.style.display = 'none'; // Hide loader
            }
        });
    }

    function getAssetLabel(asset) {
        const labels = {
            'GLD': 'GLD',
            // 'INDEXCBOE-VIX': 'VIX',
            // 'INDEXDJX-_DJI': 'DJI',
            // 'INDEXHANGSENG-HSI': 'HSI',
            // 'INDEXNASDAQ-_IXIC': 'NASDAQ',
            // 'INDEXSP-_INX': 'S&P500',
            // 'TQQQ': 'TQQQ',
            // 'USO': 'USO'
            // Add more mappings if known
        };
        return labels[asset] || asset.split(/[-_]/).pop().toUpperCase(); // Fallback to last part
    }

    // --- Trade Simulation and Analysis ---
    function calculateRequiredEdge(batch, edge_risk_multiplier = 1.5, edge_min_abs = 0.015, edge_vol_factor = 0.0) {
        const mids = batch.map(p => (p.predicted_low + p.predicted_high) / 2);
        const lows = batch.map(p => p.predicted_low);
        const highs = batch.map(p => p.predicted_high);
        const n = batch.length;

        // Expected return: from first mid to last mid
        const expected_return = mids[n - 1] / mids[0] - 1.0;
        if (expected_return <= 0) return { valid: false, reason: "no positive expected return" };

        // 1. Range-based risk (same as Python)
        const daily_range_pct = highs.map((h, i) => (h - lows[i]) / mids[i]);
        const avg_range_pct = daily_range_pct.reduce((a, b) => a + b, 0) / daily_range_pct.length;
        const estimated_risk = Math.max(0.0, avg_range_pct * edge_risk_multiplier);

        // 2. Optional volatility component
        let vol_component = 0;
        if (edge_vol_factor > 0) {
            const log_rets = [];
            for (let i = 1; i < mids.length; i++) {
                log_rets.push(Math.log(mids[i] / mids[i - 1]));
            }
            if (log_rets.length > 1) {
                const mean_log_ret = log_rets.reduce((a, b) => a + b, 0) / log_rets.length;
                const variance_log_ret = log_rets.reduce((s, x) => s + Math.pow(x - mean_log_ret, 2), 0) / log_rets.length;
                const std_log_ret = Math.sqrt(variance_log_ret);
                const pred_vol_annual = std_log_ret * Math.sqrt(252 / (n - 1)); // Annualize based on horizon
                vol_component = edge_vol_factor * pred_vol_annual;
            }
        }

        const required_edge = edge_min_abs + estimated_risk + vol_component;

        if (expected_return < required_edge) {
            return { valid: false, reason: "edge too small", expected_return, required_edge };
        }

        return {
            valid: true,
            expected_return,
            required_edge,
            batch_min_low: Math.min(...lows),
            batch_max_high: Math.max(...highs)
        };
    }
    function simulateAndAnalyzeTrades(data, start, end) {
        const trades = [];

        for (const creationDate in data) {
            if (new Date(creationDate) < new Date(start) || new Date(creationDate) > new Date(end)) continue;

            const batch = data[creationDate][activeAsset];
            if (!batch || batch.length === 0) continue;

            const valid = batch.every(p => p.actual_low > 0 && p.actual_high > 0 && p.actual_close > 0);
            if (!valid) continue;

            const edgeResult = calculateRequiredEdge(batch, edgeRiskMultiplier, edgeMinAbs, edgeVolFactor);
            if (!edgeResult.valid) continue;

            // === 2. Define Scale-In & Scale-Out Levels ===
            const lows = batch.map(p => p.predicted_low);
            const highs = batch.map(p => p.predicted_high);
            const entry_min = Math.min(...lows);
            const entry_max = Math.max(...lows);
            const exit_min = Math.min(...highs);
            const exit_max = Math.max(...highs);

            const entry_levels = linspace(entry_min, entry_max, scaleParts);
            
            let entry_weights;
            if (scaleEntryStyle === "low_bias") {
                const raw_weights = linspace(0.35, 0.15, scaleParts);
                const sum = raw_weights.reduce((a, b) => a + b, 0);
                entry_weights = raw_weights.map(w => w / sum);
            } else {
                entry_weights = Array(scaleParts).fill(1 / scaleParts);
            }

            const exit_levels = linspace(exit_min, exit_max, scaleParts);
            
            let exit_weights;
            if (scaleExitStyle === "high_bias") {
                const raw_weights = linspace(0.15, 0.35, scaleParts);
                const sum = raw_weights.reduce((a, b) => a + b, 0);
                exit_weights = raw_weights.map(w => w / sum);
            } else {
                exit_weights = Array(scaleParts).fill(1 / scaleParts);
            }

            // === 3. Simulation State ===
            const filled_entry_idx = new Set();
            const filled_exit_idx = new Set();
            let total_shares = 0.0;
            let total_invested_usd = 0.0;
            let avg_entry_price = 0.0;
            let cut_price = null;
            let force_exit_day = null;

            const actualLows = batch.map(p => p.actual_low);
            const actualHighs = batch.map(p => p.actual_high);
            const actualOpens = batch.map(p => p.actual_open);
            const actualCloses = batch.map(p => p.actual_close);
            const n = batch.length;

            // === 4. Day-by-Day Execution ===
            for (let day = 0; day < n; day++) {
                const low_today = actualLows[day];
                const high_today = actualHighs[day];

                // --- Scale-In Entries ---
                if (filled_entry_idx.size < scaleParts) {
                    for (let i = 0; i < scaleParts; i++) {
                        if (!filled_entry_idx.has(i) && low_today <= entry_levels[i]) {
                            const usd = fixedAmount * entry_weights[i];
                            const shares = usd / entry_levels[i];
                            total_invested_usd += usd;
                            total_shares += shares;
                            filled_entry_idx.add(i);

                            // Update average entry & stop-loss
                            if (total_shares > 0) {
                                avg_entry_price = total_invested_usd / total_shares;
                                if (cutLossPct > 0) {
                                    cut_price = avg_entry_price * (1 - cutLossPct / 100);
                                }
                            }
                            break; // only one entry per day
                        }
                    }
                }

                // --- Stop-Loss Check ---
                if (cut_price !== null && total_shares > 0 && low_today <= cut_price) {
                    force_exit_day = day;
                    break;
                }

                // --- Scale-Out Exits ---
                if (total_shares > 0 && filled_exit_idx.size < scaleParts) {
                    for (let i = 0; i < scaleParts; i++) {
                        if (!filled_exit_idx.has(i) && high_today >= exit_levels[i]) {
                            const weight = exit_weights[i];
                            const shares_to_sell = total_shares * weight;
                            total_shares -= shares_to_sell;
                            filled_exit_idx.add(i);
                            break; // only one exit per day
                        }
                    }
                }

                // --- Force exit on last day ---
                if (day === n - 1 && total_shares > 0) {
                    force_exit_day = day;
                }
            }

            // === 5. Final PnL Calculation ===
            let gross_pnl = 0.0;

            // Realized from scaled exits
            filled_exit_idx.forEach(i => {
                const exit_price = exit_levels[i];
                const weight = exit_weights[i];
                gross_pnl += weight * fixedAmount * (exit_price / avg_entry_price - 1);
            });

            // Remaining position: exit at worst price on last day
            let remaining_weight = 1.0;
            filled_exit_idx.forEach(i => {
                remaining_weight -= exit_weights[i];
            });
            
            // Floating point correction
            if (remaining_weight < 0.000001) remaining_weight = 0;

            if (remaining_weight > 0 && total_shares > 0) {
                const exit_price = Math.min(actualOpens[n - 1], actualCloses[n - 1]);
                gross_pnl += remaining_weight * fixedAmount * (exit_price / avg_entry_price - 1);
            }

            // Stop-loss override
            if (force_exit_day !== null && cut_price !== null && force_exit_day < n - 1) {
                gross_pnl = total_invested_usd * (cut_price / avg_entry_price - 1);
            }

            // Fees
            const n_entries = filled_entry_idx.size;
            const n_exits = filled_exit_idx.size + (remaining_weight > 0 ? 1 : 0);
            
            const feeBuy = (feePerc / 100) * total_invested_usd + fixedFee * n_entries;
            const total_sell_value = total_invested_usd + gross_pnl;
            const feeSell = (feePerc / 100) * total_sell_value + fixedFee * n_exits;
            
            const netProfit = gross_pnl - feeBuy - feeSell;

            // === 6. Success Criteria (Smoothed) ===
            const exit_fill_rate = filled_exit_idx.size / scaleParts;
            // Calculate success score (0.0 to 1.0)
            const successScore = (netProfit > 0) ? exit_fill_rate : 0.0;

            if (total_invested_usd > 0) {
                trades.push({
                    profit: netProfit,
                    forced: successScore === 0,
                    successScore: successScore,
                    success: successScore > 0
                });
            }
        }

        // === Build stats (same structure as rolling backtest) ===
        const totalBatches = Object.keys(data).filter(d => {
            const b = data[d][activeAsset];
            return b && b.length > 0 && b.every(p => p.actual_low > 0);
        }).length;

        const numTrades = trades.length;
        
        // Sum of success scores
        const totalSuccessScore = trades.reduce((sum, t) => sum + (t.successScore || 0), 0);
        
        const successfulTrades = trades.filter(t => t.successScore > 0);
        const failedTrades = trades.filter(t => t.successScore === 0);
        
        const wins = trades.filter(t => t.profit > 0);
        const losses = trades.filter(t => t.profit <= 0);
        
        const forced = failedTrades;
        const forcedWins = forced.filter(t => t.profit > 0);
        const forcedLosses = forced.filter(t => t.profit <= 0);

        const totalProfit = trades.reduce((s, t) => s + t.profit, 0);
        const roi = numTrades > 0 ? (totalProfit / (numTrades * fixedAmount)) * 100 : 0;

        const result = {};
        result[activeAsset] = {
            total_batches: totalBatches,
            num_trades: numTrades,
            num_gains: wins.length,
            num_losses: losses.length,
            pct_gains: numTrades ? (wins.length / numTrades) * 100 : 0,
            pct_losses: numTrades ? (losses.length / numTrades) * 100 : 0,

            num_successful: totalSuccessScore,
            num_success_batches: totalSuccessScore,
            num_failed_batches: forced.length,
            num_no_action_batches: totalBatches - numTrades,

            pct_success_batches: totalBatches ? (totalSuccessScore / totalBatches) * 100 : 0,
            pct_failed_batches: totalBatches ? (forced.length / totalBatches) * 100 : 0,
            pct_no_action_batches: totalBatches ? ((totalBatches - numTrades) / totalBatches) * 100 : 0,

            avg_successful_earning: successfulTrades.length ? successfulTrades.reduce((s,t)=>s+t.profit,0)/successfulTrades.length : 0,

            // THESE WERE MISSING → CRASH!
            avg_overall_win: wins.length ? wins.reduce((s,t)=>s+t.profit,0)/wins.length : 0,
            avg_overall_loss: losses.length ? losses.reduce((s,t)=>s+t.profit,0)/losses.length : 0,

            num_forced: forced.length,
            num_forced_win: forcedWins.length,
            num_forced_loss: forcedLosses.length,
            pct_forced_win: forced.length ? (forcedWins.length / forced.length) * 100 : 0,
            pct_forced_loss: forced.length ? (forcedLosses.length / forced.length) * 100 : 0,
            avg_forced_win: forcedWins.length ? forcedWins.reduce((s,t)=>s+t.profit,0)/forcedWins.length : 0,
            avg_forced_loss: forcedLosses.length ? forcedLosses.reduce((s,t)=>s+t.profit,0)/forcedLosses.length : 0,

            total_profit: totalProfit,
            roi: roi
        };

        return result;
    }
    

    // --- Batch Type Determination ---
    function getBatchType(forecastDate, asset, params = {}) {
        const {
            cutLossPct = 0,
            edge_risk_multiplier = 1.5,
            edge_min_abs = 0.034,
            edge_vol_factor = 0.0
        } = params;

        const batch = forecastData[forecastDate]?.[asset];
        if (!batch || batch.length === 0) return { type: "invalid", text: "Invalid Batch", color: "gray" };

        const allActualsFilled = batch.every(p => p.actual_low > 0 && p.actual_high > 0 && p.actual_close > 0);
        if (!allActualsFilled) return { type: "future", text: "Future Batch", color: "blue" };

        // === APPLY REAL EDGE FILTER ===
        const edgeResult = calculateRequiredEdge(batch, edge_risk_multiplier, edge_min_abs, edge_vol_factor);
        // if (edgeResult.valid) {
        //     subtitle.textContent = `${getAssetLabel(asset)} | Edge: ${(edgeResult.expected_return*100).toFixed(2)}% > Req: ${(edgeResult.required_edge*100).toFixed(2)}% → TRADE`;
        // } else {
        //     subtitle.textContent = `${getAssetLabel(asset)} | Edge: ${(edgeResult.expected_return*100).toFixed(2)}% < Req: ${(edgeResult.required_edge*100).toFixed(2)}% → NO TRADE`;
        // }
        if (!edgeResult.valid) {
            return { type: "noaction", text: `No Action (${edgeResult.reason})`, color: "orange" };
        }

        const { batch_min_low, batch_max_high } = edgeResult;
        const n = batch.length;

        // Buy fill?
        let buyDay = -1;
        for (let i = 0; i < n; i++) {
            if (batch[i].actual_low <= batch_min_low) {
                buyDay = i;
                break;
            }
        }
        if (buyDay === -1) {
            return { type: "noaction", text: "No Action (No Fill)", color: "orange" };
        }

        // Cut loss?
        if (cutLossPct > 0) {
            const stop = batch_min_low * (1 - cutLossPct / 100);
            for (let i = buyDay; i < n; i++) {
                if (batch[i].actual_low <= stop) {
                    return { type: "failed", text: "Failed (Cut Loss)", color: "red" };
                }
            }
        }

        // Success = hit batch_max_high BEFORE day n
        let targetHitDay = -1;
        for (let i = buyDay + 1; i < n; i++) {  // start checking next day
            if (batch[i].actual_high >= batch_max_high) {
                targetHitDay = i;
                break;
            }
        }

        if (targetHitDay !== -1) {
            return { type: "success", text: "Success (Target Hit)", color: "green" };
        }

        // Everything else = failed (forced exit, small profit, late hit, etc.)
        return { type: "failed", text: "Failed (No Target Hit)", color: "red" };
    }
    
    // --- Infographics Rendering Function ---
    function computeOverallStats() {
        const allDates = Object.keys(forecastData)
            .filter(d => new Date(d) >= new Date(activeStartDate) && new Date(d) <= new Date(activeEndDate))
            .sort();

        let totalBatches = 0;
        let success = 0;
        let failed = 0;
        let noActionOrFuture = 0;

        allDates.forEach(date => {
            const batch = forecastData[date]?.[activeAsset];
            if (!batch || batch.length === 0) return;

            totalBatches++;

            const info = getBatchType(date, activeAsset, { cutLossPct, edge_risk_multiplier: edgeRiskMultiplier, edge_min_abs: edgeMinAbs, edge_vol_factor: edgeVolFactor });

            if (info.type === "success") success++;
            else if (info.type === "failed") failed++;
            else noActionOrFuture++;  // includes noaction + future
        });

        const tradesTaken = success + failed;

        // Always return a valid object – never undefined
        return {
            total_batches: totalBatches,
            num_trades: tradesTaken,
            num_gains: success,
            num_losses: failed,
            pct_gains: tradesTaken > 0 ? (success / tradesTaken) * 100 : 0,
            pct_losses: tradesTaken > 0 ? (failed / tradesTaken) * 100 : 0,
            num_successful: success,
            pct_successful: tradesTaken > 0 ? (success / tradesTaken) * 100 : 0,
            num_success_batches: success,
            pct_success_batches: totalBatches > 0 ? (success / totalBatches) * 100 : 0,
            num_failed_batches: failed,
            pct_failed_batches: totalBatches > 0 ? (failed / totalBatches) * 100 : 0,
            num_no_action_batches: noActionOrFuture,
            pct_no_action_batches: totalBatches > 0 ? (noActionOrFuture / totalBatches) * 100 : 0,
            total_profit: 0,
            roi: 0
        };
    }

                custom: function({ series, seriesIndex, dataPointIndex, w }) {
                    if (dataPointIndex === undefined || dataPointIndex < 0) return '';

                    const date = new Date(w.globals.seriesX[0][dataPointIndex]).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });

                    // Safely get actual candle (index 0) and predicted candle (index 1)
                    const actual = w.globals.initialSeries[0]?.data[dataPointIndex]?.y || [];
                    const pred   = w.globals.initialSeries[1]?.data[dataPointIndex]?.y || [];

                    // Helper to safely format number or return 'N/A'
                    const fmt = (val) => (val != null && !isNaN(val)) ? Number(val).toFixed(2) : 'N/A';

                    return `
                        <div class="apexcharts-tooltip-title" style="font-weight: bold; padding: 4px 8px; background: #1a202c; color: #fff;">${date}</div>
                        <div style="padding: 4px 8px;">
                            <strong>Actual:</strong><br>
                            Open: $${fmt(actual[0])}<br>
                            High: $${fmt(actual[1])}<br>
                            Low:  $${fmt(actual[2])}<br>
                            Close: $${fmt(actual[3])}
                        </div>
                        <div style="padding: 4px 8px;">
                            <strong>Predicted:</strong><br>
                            Open: $${fmt(pred[0])}<br>
                            High: $${fmt(pred[1])}<br>
                            Low:  $${fmt(pred[2])}<br>
                            Close: $${fmt(pred[3])}
                        </div>
                    `;
                }
            },
            legend: { horizontalAlign: 'center', position: 'top' },
            theme: { mode: 'dark' }
        };
        mergedChart = new ApexCharts(mergedContainer, mergedOptions);
        mergedChart.render();

        // Compute and display suggested prices based on predictions
        const predictions = chartData;
        let batchMinLow = Math.min(...predictions.map(p => p.predicted_low));
        let batchMaxHigh = Math.max(...predictions.map(p => p.predicted_high));
        let suggestedText = '';
        if (batchMaxHigh < batchMinLow * (1 + minGainPct / 100)) {
            suggestedText = 'Insufficient Predicted Gain - No Buy Suggested';
        } else {
            let buyPrice = batchMinLow;
            let cutLossPrice = buyPrice * (1 - cutLossPct / 100);
            let sellPrice = null;
            let sellDay = null;
            suggestedText = 'Suggested Buy: $' + buyPrice.toFixed(2) + 
                ' | Target: Break above $' + batchMaxHigh.toFixed(2) +
                ' | Cut Loss: ' + (cutLossPct > 0 ? '$' + cutLossPrice.toFixed(2) : 'None');
        }
        suggestedPricesElement.textContent = suggestedText;
    }

    // --- Button Styling Function ---
    function updateButtonStyles() {
        assetButtons.forEach(button => {
            const isActive = button.dataset.asset === activeAsset;
            button.classList.toggle('bg-blue-600', isActive);
            button.classList.toggle('text-white', isActive);
            button.classList.toggle('bg-gray-700', !isActive);
            button.classList.toggle('text-gray-300', !isActive);
            button.classList.toggle('hover:bg-blue-500', !isActive);
        });
    }

    // --- URL Parameter Functions ---
    function updateURLParams() {
        const params = new URLSearchParams();
        params.set('forecast_date', activeForecastDate);
        params.set('start_date', activeStartDate);
        params.set('end_date', activeEndDate);
        params.set('asset', activeAsset);
        params.set('initial_capital', fixedAmount);
        params.set('cutloss_pct', cutLossPct);
        params.set('fee_perc', feePerc);
        params.set('fixed_fee', fixedFee);
        params.set('min_gain_pct', minGainPct);
        if (edgeRiskMultiplier !== null) params.set('edge_risk_multiplier', edgeRiskMultiplier);
        if (edgeMinAbs !== null) params.set('edge_min_abs', edgeMinAbs);
        if (edgeVolFactor !== null) params.set('edge_vol_factor', edgeVolFactor);
        params.set('scale_parts', scaleParts);
        params.set('scale_entry_style', scaleEntryStyle);
        params.set('scale_exit_style', scaleExitStyle);
        history.pushState({}, '', `${location.pathname}?${params.toString()}`);
    }

    // --- Share Function ---
    async function shareCurrentView() {
        const shareData = {
            title: 'Temporal Contextual Attention Network View',
            text: 'Check out this prediction analysis!',
            url: window.location.href
        };

        if (navigator.canShare && navigator.canShare(shareData)) {
            try {
                await navigator.share(shareData);
            } catch (err) {
                console.error('Share failed:', err);
                fallbackCopyToClipboard();
            }
        } else {
            fallbackCopyToClipboard();
        }
    }

    function fallbackCopyToClipboard() {
        const url = window.location.href;
        navigator.clipboard.writeText(url).then(() => {
            alert('URL copied to clipboard!');
        }).catch(err => {
            console.error('Failed to copy:', err);
            alert('Failed to copy URL. Please copy manually: ' + url);
        });
    }

    // --- Main Initialization Function (called AFTER data is loaded) ---
    function initialize() {
        const availableDates = Object.keys(forecastData).sort((a, b) => new Date(b) - new Date(a));
        if (availableDates.length > 0) {
            const minDate = availableDates[availableDates.length - 1];
            const maxDate = availableDates[0];
            forecastDatePicker.min = minDate;
            forecastDatePicker.max = maxDate;
            startDatePicker.min = minDate;
            startDatePicker.max = maxDate;
            endDatePicker.min = minDate;
            endDatePicker.max = maxDate;

            const urlParams = new URLSearchParams(window.location.search);

            const erm = parseFloat(urlParams.get('edge_risk_multiplier'));
            edgeRiskMultiplier = !isNaN(erm) ? erm : 0.0;

            const ema = parseFloat(urlParams.get('edge_min_abs'));
            edgeMinAbs = !isNaN(ema) ? ema : 0.0001;

            const evf = parseFloat(urlParams.get('edge_vol_factor'));
            edgeVolFactor = !isNaN(evf) ? evf : 0.00009;

            const sp = parseInt(urlParams.get('scale_parts'));
            scaleParts = !isNaN(sp) ? sp : 1;

            const ses = urlParams.get('scale_entry_style');
            scaleEntryStyle = ses || "even";

            const sxs = urlParams.get('scale_exit_style');
            scaleExitStyle = sxs || "high_bias";

            activeStartDate = urlParams.get('start_date') || "2025-01-01";
            if (new Date(activeStartDate) < new Date(minDate) || new Date(activeStartDate) > new Date(maxDate)) {
                activeStartDate = minDate;
            }

            activeEndDate = urlParams.get('end_date') || maxDate;
            if (new Date(activeEndDate) < new Date(minDate) || new Date(activeEndDate) > new Date(maxDate)) {
                activeEndDate = maxDate;
            }

            activeForecastDate = urlParams.get('forecast_date') || minDate;
            if (new Date(activeForecastDate) < new Date(minDate) || new Date(activeForecastDate) > new Date(maxDate)) {
                activeForecastDate = minDate;
            }

            cutLossPct = parseFloat(urlParams.get('cutloss_pct')) || 6;
            if (isNaN(cutLossPct) || cutLossPct < 0) cutLossPct = 6;

            fixedAmount = parseFloat(urlParams.get('initial_capital')) || 10000;
            if (isNaN(fixedAmount) || fixedAmount < 1) fixedAmount = 10000;

            feePerc = parseFloat(urlParams.get('fee_perc')) || 0;
            if (isNaN(feePerc) || feePerc < 0) feePerc = 0;

            fixedFee = parseFloat(urlParams.get('fixed_fee')) || 0;
            if (isNaN(fixedFee) || fixedFee < 0) fixedFee = 0;

            minGainPct = parseFloat(urlParams.get('min_gain_pct')) || 0;
            if (isNaN(minGainPct) || minGainPct < 0) minGainPct = 0;

            forecastDatePicker.value = activeForecastDate;
            startDatePicker.value = activeStartDate;
            endDatePicker.value = activeEndDate;
            cutLossInput.value = cutLossPct;
            initialCapitalInput.value = fixedAmount;
            feePctInput.value = feePerc;
            fixedFeeInput.value = fixedFee;
            minGainInput.value = minGainPct;
            edgeRiskMultiplierInput.value = edgeRiskMultiplier;
            edgeMinAbsInput.value = edgeMinAbs;
            edgeVolFactorInput.value = edgeVolFactor;
            scalePartsInput.value = scaleParts;
            scaleEntryStyleInput.value = scaleEntryStyle;
            scaleExitStyleInput.value = scaleExitStyle;
        }
        
        forecastDatePicker.addEventListener('change', () => {
            activeForecastDate = forecastDatePicker.value;
            updateURLParams();
            renderCharts();
        });

        startDatePicker.addEventListener('change', () => {
            activeStartDate = startDatePicker.value;
            updateURLParams();
            updateStats();
        });

        endDatePicker.addEventListener('change', () => {
            activeEndDate = endDatePicker.value;
            updateURLParams();
            updateStats();
        });

        cutLossInput.addEventListener('input', () => {
            cutLossPct = parseFloat(cutLossInput.value) || 0;
            updateURLParams();
            updateStats();
            renderCharts();
        });

        initialCapitalInput.addEventListener('input', () => {
            fixedAmount = parseFloat(initialCapitalInput.value) || 10000;
            updateURLParams();
            updateStats();
        });

        feePctInput.addEventListener('input', () => {
            feePerc = parseFloat(feePctInput.value) || 0;
            updateURLParams();
            updateStats();
        });

        fixedFeeInput.addEventListener('input', () => {
            fixedFee = parseFloat(fixedFeeInput.value) || 0;
            updateURLParams();
            updateStats();
        });

        minGainInput.addEventListener('input', () => {
            minGainPct = parseFloat(minGainInput.value) || 0;
            updateURLParams();
            updateStats();
            renderCharts();
        });

        edgeRiskMultiplierInput.addEventListener('input', () => {
            const val = parseFloat(edgeRiskMultiplierInput.value);
            edgeRiskMultiplier = !isNaN(val) ? val : 1.5;
            updateURLParams();
            updateStats();
            renderCharts();
        });

        edgeMinAbsInput.addEventListener('input', () => {
            const val = parseFloat(edgeMinAbsInput.value);
            edgeMinAbs = !isNaN(val) ? val : 0.034;
            updateURLParams();
            updateStats();
            renderCharts();
        });

        edgeVolFactorInput.addEventListener('input', () => {
            const val = parseFloat(edgeVolFactorInput.value);
            edgeVolFactor = !isNaN(val) ? val : 0.0;
            updateURLParams();
            updateStats();
            renderCharts();
        });

        scalePartsInput.addEventListener('input', () => {
            const val = parseInt(scalePartsInput.value);
            scaleParts = !isNaN(val) ? val : 4;
            updateURLParams();
            updateStats();
            renderCharts();
        });

        scaleEntryStyleInput.addEventListener('change', () => {
            scaleEntryStyle = scaleEntryStyleInput.value;
            updateURLParams();
            updateStats();
            renderCharts();
        });

        scaleExitStyleInput.addEventListener('change', () => {
            scaleExitStyle = scaleExitStyleInput.value;
            updateURLParams();
            updateStats();
            renderCharts();
        });

        shareButton.addEventListener('click', shareCurrentView);

        document.getElementById('copy-json-button').addEventListener('click', () => {
            const jsonResults = getOverallResultsJSON(activeAsset);
            navigator.clipboard.writeText(jsonResults).then(() => {
                alert('Overall results copied to clipboard as JSON!');
            }).catch(err => {
                console.error('Failed to copy JSON:', err);
                alert('Failed to copy results. See console for details.');
            });
        });

        jumpToLatestButton.addEventListener('click', () => {
            // Step 1: Get all available model creation dates, newest first
            const availableDates = Object.keys(forecastData).sort((a, b) => new Date(b) - new Date(a));

            // Step 2: Today's date (you said current date is Nov 18, 2025 — but in real use it's dynamic)
            const today = new Date();
            today.setHours(0, 0, 0, 0); // Normalize to midnight

            // Step 3: Find the latest date where prediction_date + 4 days still has actual data
            //     → meaning the batch is fully observable today
            let latestValidForecastDate = null;

            for (const dateStr of availableDates) {
                const forecastDate = new Date(dateStr);
                forecastDate.setHours(0, 0, 0, 0);

                // Check if this batch's 5th day is in the past or today
                const fifthDay = new Date(forecastDate);
                fifthDay.setDate(fifthDay.getDate() + 4);

                if (fifthDay <= today) {
                    latestValidForecastDate = dateStr;
                    break; // This is the newest fully observable batch
                }
            }

            if (!latestValidForecastDate && availableDates.length > 0) {
                // Fallback: if market is closed or weekend, use the most recent available
                latestValidForecastDate = availableDates[0];
            }

            if (latestValidForecastDate) {
                forecastDatePicker.value = latestValidForecastDate;
                activeForecastDate = latestValidForecastDate;
                updateURLParams();
                renderCharts();
            }
        });

        const assetButtonsContainer = document.getElementById('asset-buttons');
        Array.from(uniqueAssets).sort().forEach(asset => {
            const button = document.createElement('button');
            button.dataset.asset = asset;
            button.textContent = getAssetLabel(asset);
            button.classList.add('control-button', 'asset-btn', 'px-4', 'py-2', 'text-sm', 'font-medium', 'rounded-md', 'transition-colors', 'duration-200');
            assetButtonsContainer.appendChild(button);
        });

        updateStats();
        let maxWinRate = -1;
        let bestAsset = null;
        for (let t in statsData) {
            if (statsData[t].pct_gains > maxWinRate) {
                maxWinRate = statsData[t].pct_gains;
                bestAsset = t;
            }
        }
        if (bestAsset) {
            activeAsset = bestAsset; // Default to best asset
        }

        // Re-query after all buttons are added
        assetButtons = document.querySelectorAll('.asset-btn');

        // Set activeAsset from URL if valid
        const urlAsset = new URLSearchParams(window.location.search).get('asset');
        if (urlAsset && uniqueAssets.has(urlAsset)) {
            activeAsset = urlAsset;
        }

        // Attach event listeners after re-query
        assetButtons.forEach(button => {
            button.addEventListener('click', () => {
                activeAsset = button.dataset.asset;
                updateURLParams();
                updateButtonStyles();
                updateStats();         
                renderCharts();
            });
        });

        // After date picker changes
        startDatePicker.addEventListener('change', () => {
            activeStartDate = startDatePicker.value;
            updateURLParams();
            updateStats();     
        });

        endDatePicker.addEventListener('change', () => {
            activeEndDate = endDatePicker.value;
            updateURLParams();
            updateStats();     
        });
        
        // Optional: Ensure activeAsset is valid (set to best or first if not)
        if (!Array.from(assetButtons).some(b => b.dataset.asset === activeAsset)) {
            activeAsset = bestAsset || assetButtons[0]?.dataset.asset;
        }

        updateButtonStyles();
        updateInfoCards(activeAsset);
        renderCharts();
        updateURLParams();
        updateStats();     
    }
    
    // --- Start the process on page load ---
    window.onload = loadAndProcessData;
</script>
